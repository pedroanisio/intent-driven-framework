      unproven:
        - "Scalability: does the model work with 100+ intents?"
        - "Political adoption: will [stakeholders] maintain intents?"
        - "Verification at scale: can [layer X] stay fast?"
        - "Change frequency: what happens when domain changes faster than version cycles?"
        - "[Domain-specific unknown]"

      # Tensions between the aspiration and reality
      tensions:
        - ref: domain-completeness-vs-adoption
          description: >
            Making the framework complete enough to handle all edge cases
            risks making it too complex for practitioners to use.
          resolution_strategy: >
            Start minimal (core 28 criteria), add domain-specific criteria
            incrementally as pilots reveal gaps.

