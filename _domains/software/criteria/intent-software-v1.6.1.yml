intent:
  id: intent-manifesto-itself
  version: 1.6.1
  schema_version: 0.1.0
  declares: >
    This manifesto intends to be a self-contained declaration of the 
    intent-driven software development model, sufficient for a practitioner 
    to understand, adopt, and extend the model without requiring access 
    to the authors or additional context.

  intent_type: aspirational

  current_reality:
    state: >
      The manifesto and spec pass all 28 core completeness criteria. 
      A five-layer verification stack exists: Lean 4 formal proofs 
      (12 CC — algebraic structure, lifecycle, staleness, log integrity), 
      NLP semantic scorer (16 CC — entailment checks on prose), pytest 
      suite (30 CC — criteria→evidence→verdict, TDD workflow, CI-native), 
      Zod v4 schema validator (YAML shape + structural invariants), and 
      Python regex scorer (28 CC — keyword heuristics, legacy baseline). 
      A Zustand flaw store tracks regressions across validation runs.
    status: >
      CC-01 through CC-27: pass (28/28 core).
      CC-04, CC-05, CC-06, CC-07, CC-08, CC-08b, CC-18, CC-23, 
        CC-25, CC-27: formally proven (Lean 4, 12 CC).
      CC-01, CC-02, CC-03, CC-08a, CC-08c, CC-09, CC-10, CC-11, 
        CC-12, CC-13, CC-14, CC-15, CC-16, CC-17, CC-19, CC-21: 
        verified by regex scorer + NLP semantic evaluation (16 CC).
      CC-20, CC-26: verified by regex scorer (prose-level).
      CC-22, CC-24: deferred — not required for v1 completeness.
    remaining_work: >
      All core criteria pass. Spec-to-formalization drift resolved 
      (achieved_coverage placement, origin_type enum alignment). 
      Deferred gaps (cross-repo discovery CC-22, schema governance 
      CC-24) tracked with promote_when conditions.
    last_assessed: "2026-02-06"

  scope:
    primary:
      - intent-manifesto.md
      - intent-spec.md
    implicit:
      - _repo/                    # CC-09, CC-10
      - schemas/                  # CC-04 through CC-08
      - plugins/                  # CC-11, CC-12
      - guides/adoption.md        # CC-13 through CC-15

  priority: critical
  status: active

  owner: authors
  confidence: medium

  origin:
    type: engineering
    ref: "conversation-2025-02-06"
    relationship: derived_from

  dependencies: []          # none — self-containment is the point

  # ─── TIER DEFINITIONS ──────────────────────────────────────────────
  # Criteria are classified into tiers to manage scope creep without 
  # losing track of known gaps.
  #
  #   core        — must pass for the manifesto to be considered v1-complete.
  #   deferred    — known gaps, tracked explicitly, not blocking v1.
  #                 Promoted to core when preconditions are met.
  #
  # Every criterion carries a tier field. Omitted tier defaults to core.

  # ─── CANONICAL ENUMS ─────────────────────────────────────────────
  # Enum values used in this intent block AND the broader model.
  # Per CC-05, every enum field must list all valid values.
  # Per CC-18, this block must conform to its own model.
  # All enums are closed. New values require a schema_version bump
  # per CC-24.
  #
  # change_type (transition_log.change_type):
  #   clarification  — rewording with no semantic change
  #   correction     — fixing inconsistencies or errors; minor semantic delta
  #   extension      — additive new content; backward-compatible
  #   reclassification — tier or category move without changing the criterion
  #   breaking       — backward-incompatible change to existing criteria
  #   deprecation    — marking a criterion or field for removal
  #
  # origin_type (origin.type) — closed, 11 values:
  #   engineering    — originated from engineering practice or architecture
  #   product        — originated from product requirement
  #   incident       — originated from incident response or postmortem
  #   discovery      — originated from exploratory or research activity
  #   regulatory     — originated from compliance or regulatory requirement
  #   organizational — originated from organizational policy or restructuring
  #   devops         — originated from infrastructure or deployment practice
  #   ux             — originated from user experience research or design
  #   data           — originated from data architecture or analytics
  #   sre            — originated from site reliability or observability
  #   security       — originated from security audit or threat model
  #   The full enum is closed. Plugins extend the model via ext: namespace
  #   (CC-12), not by adding origin_type values.
  #
  # origin_relationship (origin.relationship):
  #   derived_from   — intent was derived from the referenced source
  #   motivated_by   — intent was motivated by but not directly derived from source
  #   constrained_by — intent exists because of a constraint imposed by source
  #   triggered_by   — intent was triggered by a specific event at source
  #   discovered_in  — intent was discovered during work on source
  #
  # priority:
  #   critical       — failure to meet this intent is a system-level risk
  #   high           — significant impact; address in current cycle
  #   medium         — moderate impact; address when adjacent work touches scope
  #   low            — minor impact; address opportunistically
  #
  # confidence:
  #   high           — intent is well-understood and stable
  #   medium         — intent is directionally correct but may evolve
  #   low            — intent is exploratory or uncertain
  #
  # status (intent lifecycle per CC-07):
  #   proposed       — declared but not yet active
  #   active         — current and enforced
  #   evolving       — active but undergoing intentional change
  #   superseded     — replaced by a successor intent
  #   residual       — no longer actively maintained; kept for reference
  #   retracted      — withdrawn before reaching active; terminal state
  #
  # tier (completeness criteria per tier definitions above):
  #   core           — must pass for v1 completeness
  #   deferred       — tracked, not blocking; promoted when precondition met
  #
  # achieved_coverage (achieved intents, optional field):
  #   none           — intent declared but no implementation exists
  #   minimal        — token implementation; intent barely addressed
  #   partial        — some commitments met; others outstanding
  #   substantial    — most commitments met; edge cases remain
  #   full           — all commitments met and verified

  transition_log:
    - from: 1.0.0
      to: 1.1.0
      change_type: extension
      summary: >
        Added current_reality block, CC-08a (conflict resolution), 
        CC-18 (self-conformance), expanded CC-06 and CC-12, 
        restructured scope into primary/implicit.

    - from: 1.1.0
      to: 1.2.0
      change_type: extension
      summary: >
        Split CC-08a into CC-08a/08b/08c. Added explicit eval_order 
        to CC-18. Added six criteria from external review: CC-19 
        (declares quality), CC-20 (tooling surface), CC-21 (adoption 
        ramp), CC-22 (cross-repo discovery), CC-23 (tension staleness), 
        CC-24 (schema governance). Added intent-spec.md to primary scope.

    - from: 1.2.0
      to: 1.3.0
      change_type: extension
      summary: >
        Introduced tier system (core/deferred) to manage scope creep.
        Moved CC-22 and CC-24 to deferred tier with promotion criteria.
        Added schema_version field to intent block (CC-24 self-conformance).
        Split current_reality.gap into status + remaining_work.
        Weakened CC-23: MINOR bumps trigger review, MAJOR triggers 
        invalidation. Added CC-25 (deprecation ceremonies) and CC-26 
        (failure modes). Softened CC-24 to principle-level governance 
        without prescribing organizational process.

    - from: 1.3.0
      to: 1.4.0
      change_type: correction
      summary: >
        Removed intent-spec.md from implicit scope (duplicate of 
        primary listing; scope should declare governance, not echo 
        criteria references). Added CC-27 (transition log integrity). 
        Added cross-repo scope boundary note to CC-25 linking it to 
        CC-22 when promoted. First correction-type transition — 
        all prior transitions were extensions.

    - from: 1.4.0
      to: 1.4.1
      change_type: clarification
      summary: >
        Canonicalized the change_type enum. Three overlapping 
        vocabulary sets existed: the manifesto's transition schema 
        (clarification | extension | breaking | deprecation), 
        CC-27's verifiable_by (extension | correction | breaking | 
        reclassification), and the transition log's actual usage 
        (extension | correction). Unified into a single canonical 
        enum of six values defined in the intent block itself. 
        CC-27 now references the canonical enum by name rather 
        than inlining its own list. This closes a CC-05 violation 
        (unbounded enum) and a CC-18 gap (intent block using 
        change_type values not defined in its own model).

    - from: 1.4.1
      to: 1.5.0
      change_type: correction
      summary: >
        Canonicalized all remaining enums that diverged between 
        the YAML, Zod schema, and manifesto prose: origin_type 
        (added scoping note for meta-intent vs domain intents), 
        origin_relationship (unified to derived_from | motivated_by 
        | constrained_by | triggered_by | discovered_in), priority 
        (unified to critical | high | medium | low). Added status 
        and confidence enums to canonical block for completeness. 
        Updated Zod schema to match. Added validateDependsOnRefs 
        structural check. Noted CC-27(b) as not automatable in 
        single-file mode.

    - from: 1.5.0
      to: 1.5.1
      change_type: correction
      summary: >
        Closed all six remaining core prose gaps: CC-08b (resolution 
        pre-transition check contract in spec), CC-19 (falsifiability 
        test and declares quality guidance in manifesto), CC-20 
        (dedicated Tooling Surface section in spec with CI, scope 
        lookup, and lifecycle hook contracts), CC-21 (next-touch 
        adoption ramp with advisory-to-enforcement transition in 
        manifesto), CC-23 (tension resolution staleness contract 
        with MAJOR/MINOR/PATCH semantics in spec), CC-25 (deprecation 
        ceremony four-step contract in spec). Fixed priority enum 
        drift in spec schema. Added retracted state operational 
        semantics in spec. Added cross-discipline tension worked 
        example in spec. Score: 28/28 core passing.

    - from: 1.5.1
      to: 1.6.0
      change_type: extension
      summary: >
        Synchronized YAML, Zod schema, and Lean 4 formalization.
        Added retracted to IntentStatus (CC-07 lifecycle terminal 
        state, proven in Lean). Closed origin_type to full 11-value 
        enum (was split core/extended — now single closed set per 
        CC-05, matching Lean inductive type). Added achieved_coverage 
        enum and optional field on Intent schema for achieved intents. 
        Added schema_version to Lean Intent structure (CC-18(d) sync). 
        Expanded Zod Status and OriginType enums to match. Updated 
        last_assessed date.

    - from: 1.6.0
      to: 1.6.1
      change_type: clarification
      summary: >
        Fixed spec-to-formalization drift. Moved achieved_coverage 
        from nested under current_reality to top-level optional 
        field on intent schema, matching Lean and Zod placement. 
        Added prose paragraph explaining achieved_coverage semantics 
        for both intent types. Fixed origin_type enum in spec: 
        product_requirement → product, added missing discovery 
        value. All three origin_type sites (intent schema, 
        origin_record schema, Lean inductive) now list identical 
        11-value closed set. Score: 28/28 core passing.

  completeness_criteria:

    # ─── PHILOSOPHY ──────────────────────────────────────────────────

    philosophy:
      - id: CC-01
        tier: core
        test: "Manifesto states the problem it solves"
        verifiable_by: "Section exists that describes current state without the model"

      - id: CC-02
        tier: core
        test: "Manifesto states the inversion explicitly"
        verifiable_by: "Section exists that names the old orientation and the new one"

      - id: CC-03
        tier: core
        test: "Every principle is named, numbered, and explained with rationale"
        verifiable_by: "Count(principles) > 0 AND each has title + body + why-it-matters"

    # ─── MODEL ───────────────────────────────────────────────────────

    model:
      - id: CC-04
        tier: core
        test: "Every first-class entity has a complete schema"
        verifiable_by: >
          Set(entities) = {intent, transition, decision, tension, manifest}
          AND each has a YAML schema with all fields typed

      - id: CC-05
        tier: core
        test: "Every enum field has all valid values listed"
        verifiable_by: "No enum field has placeholder or unbounded values"

      - id: CC-06
        tier: core
        test: "Every relationship between entities is bidirectionally defined"
        verifiable_by: >
          If entity A references entity B, B's schema shows 
          how it is referenced by A.
        implementation_note: >
          Prefer single-source-of-truth generation (e.g., a relations 
          table that emits both directions) over manual duplication 
          to limit maintenance burden.

      - id: CC-07
        tier: core
        test: "Intent lifecycle is complete — every state has entry and exit conditions"
        verifiable_by: >
          Set(states) = {proposed, active, evolving, superseded, residual, retracted}
          AND each state has defined transition triggers

      - id: CC-08
        tier: core
        test: "Both intent types (achieved/aspirational) have distinct schemas"
        verifiable_by: >
          Aspirational intent schema includes current_reality block.
          Achieved intent schema does not require it.
          Transition from aspirational → achieved is defined.

    # ─── CONFLICT ────────────────────────────────────────────────────

    conflict:
      - id: CC-08a
        tier: core
        test: "Contradiction between active intents is detected and resolved"
        verifiable_by: >
          Document defines what happens when a proposed intent directly 
          contradicts an existing active intent. At minimum:
            (a) the contradiction is surfaced as a supersession proposal,
            (b) the resolution_owner or intent owner decides whether 
                the supersession proceeds,
            (c) the outcome is recorded as an intent transition.

      - id: CC-08b
        tier: core
        test: "Transitions that would violate active intents are caught"
        verifiable_by: >
          Document defines what happens when a proposed transition on 
          intent A would break an active resolution that depends on A's 
          current version. At minimum:
            (a) tensions referencing A are checked before the transition 
                is accepted,
            (b) stale resolutions are flagged,
            (c) the transition is blocked or the resolution is updated.

      - id: CC-08c
        tier: core
        test: "Scope overlap between intents is detectable"
        verifiable_by: >
          Document defines what happens when two intents bind 
          overlapping scopes with potentially conflicting commitments.
          At minimum:
            (a) a heuristic or tooling check identifies scope overlap,
            (b) overlapping intents must either declare a tension or 
                establish a serves relationship,
            (c) unresolved overlap is flagged in CI validation.

    # ─── STRUCTURE ───────────────────────────────────────────────────

    structure:
      - id: CC-09
        tier: core
        test: "Repository structure is fully specified"
        verifiable_by: "Directory tree exists with every folder named and purpose stated"

      - id: CC-10
        tier: core
        test: "A reader can create the _repo/ folder from the manifesto alone"
        verifiable_by: >
          No directory or file in the structure requires knowledge 
          not present in the document

    # ─── EXTENSIBILITY ───────────────────────────────────────────────

    extensibility:
      - id: CC-11
        tier: core
        test: "Plugin architecture is defined with at least one concrete example"
        verifiable_by: >
          Plugin manifest schema exists AND registry schema exists 
          AND >= 1 worked example shows a plugin extending the core model

      - id: CC-12
        tier: core
        test: "Extension surface on core entities is defined with semantics"
        verifiable_by: >
          ext: namespace syntax is shown on intent schema with example.
          Semantics specify:
            (a) extensions MUST NOT override or shadow core fields,
            (b) extensions are namespaced per-plugin (ext.<plugin_id>.*),
            (c) core tooling MUST ignore unrecognised ext: keys gracefully,
            (d) at least one example demonstrates a plugin adding 
                an ext: field and reading it back.

    # ─── ADOPTION ────────────────────────────────────────────────────

    adoption:
      - id: CC-13
        tier: core
        test: "Adoption sequence is ordered and actionable"
        verifiable_by: >
          Numbered steps exist. Each step has a concrete action. 
          No step requires external knowledge.

      - id: CC-14
        tier: core
        test: "Legacy strategy does not require comprehensive audit"
        verifiable_by: >
          Document explicitly states that aspirational intent can be 
          declared without understanding existing code

      - id: CC-15
        tier: core
        test: "At least three practical entry points are described"
        verifiable_by: >
          Distinct named strategies exist (e.g., pain-first, 
          next-touch, amnesty) with enough detail to execute

    # ─── SELF-SUFFICIENCY ────────────────────────────────────────────

    self-sufficiency:
      - id: CC-16
        tier: core
        test: "No principle references concepts defined only outside the document"
        verifiable_by: >
          Every term used in a principle is either common knowledge 
          or defined in the manifesto

      - id: CC-17
        tier: core
        test: "The daily practice is stated concretely"
        verifiable_by: >
          A section exists with specific behavioral instructions:
          when to declare, when to link, when to record, when to check

    # ─── SELF-CONFORMANCE ────────────────────────────────────────────

    self-conformance:
      - id: CC-18
        tier: core
        eval_order: last
        depends_on: [CC-08]
        test: "This intent block conforms to the model it specifies"
        verifiable_by: >
          This intent passes validation against the aspirational intent 
          schema defined in the manifesto body (CC-08). Specifically:
            (a) current_reality block is present and non-empty,
            (b) scope covers all artifacts referenced by CC-* criteria,
            (c) all required fields per the schema are populated,
            (d) schema_version is present and references a defined version.
          This criterion can only be evaluated after CC-08 passes.
          If CC-08 fails, CC-18 is skipped (not failed).
        note: >
          This is the bootstrap criterion. If the manifesto's own 
          intent block doesn't eat its own cooking, the model fails 
          its most basic test.

    # ─── OPERATIONAL READINESS ───────────────────────────────────────

    operational:
      - id: CC-19
        tier: core
        test: "The declares field has quality guidance"
        verifiable_by: >
          The manifesto defines what distinguishes a good declares 
          statement from a bad one. At minimum:
            (a) a falsifiability test is stated — if no code change 
                could violate the declaration, it is not an intent,
            (b) at least one positive and one negative example are given,
            (c) a recommended grammar or structure is suggested 
                (e.g., subject + commitment verb + observable predicate).
        rationale: >
          The declares field is the core semantic payload of the entire 
          model. It is free-text natural language. Without quality 
          guidance, it will fill with platitudes that pass schema 
          validation but capture nothing.

      - id: CC-20
        tier: core
        test: "The spec defines a tooling surface"
        verifiable_by: >
          The spec (intent-spec.md) contains a dedicated section that 
          defines at minimum:
            (a) what is validated in CI (schema validation, ref resolution),
            (b) how intents are queried by file path (scope lookup),
            (c) how lifecycle events propagate (hook invocation contract).
          The section need not prescribe implementations but must 
          define the contracts that implementations must satisfy.
        rationale: >
          Schemas without tooling hooks are inert YAML files. The spec 
          defines data structures but not the operations on them. 
          Without a tooling contract, every adopter invents their own 
          incompatible toolchain.

      - id: CC-21
        tier: core
        test: "The next-touch rule has an adoption ramp"
        verifiable_by: >
          The adoption sequence includes a grace period or advisory 
          phase for the next-touch rule. Specifically:
            (a) the rule starts as advisory (non-blocking) for a 
                defined period,
            (b) the transition to enforcement is described,
            (c) the rationale addresses the cold-start problem on 
                legacy code where the first PR into undeclared 
                territory carries double burden.
        rationale: >
          On a legacy codebase with zero declared intents, "every PR 
          must reference an intent" is a gate that blocks every PR 
          until someone does the archaeology. A ramp period lets the 
          team build critical mass before enforcement creates friction.

      - id: CC-23
        tier: core
        test: "Tension resolution staleness is contractually defined"
        verifiable_by: >
          The spec defines when a tension resolution becomes stale.
          At minimum:
            (a) a MAJOR bump on either referenced intent triggers 
                invalidation — the resolution is marked stale and 
                must be re-evaluated before the transition lands,
            (b) a MINOR bump on either referenced intent triggers 
                a review flag — the resolution is not invalidated 
                but is surfaced for human assessment,
            (c) a PATCH bump is explicitly excluded from triggering 
                either staleness or review,
            (d) the validator or lifecycle hook that enforces 
                staleness detection is named.
        rationale: >
          The tension schema has applies_to: [semver, semver] on 
          resolutions, but the spec never defines the contract for 
          when that field means the resolution is no longer valid. 
          MINOR bumps can add new commitments to declares, which 
          may invalidate compatibility assessments. Full invalidation 
          is too aggressive; review is proportionate.

      - id: CC-25
        tier: core
        test: "Deprecation ceremonies for superseded/residual intents are defined"
        verifiable_by: >
          The spec defines what happens to downstream references when 
          an intent enters the superseded or residual lifecycle state.
          At minimum:
            (a) all intents with depends_on references to the 
                deprecated intent are identified and notified,
            (b) a migration path is stated — dependents must either 
                re-point to the successor intent, drop the dependency, 
                or acknowledge the residual state,
            (c) a grace period or deadline for dependent migration 
                is defined (or explicitly left to the intent owner),
            (d) unresolved downstream references after the grace 
                period are surfaced as tensions.
        scope_boundary: >
          Within a single repository, downstream references are 
          discoverable by static analysis of intent files. Cross-repo 
          discovery requires the protocol defined in CC-22. Until 
          CC-22 is promoted to core, CC-25 is testable only within 
          single-repo boundaries. When CC-22 is promoted, CC-25's 
          verification implicitly extends to cross-repo dependents.
        rationale: >
          CC-07 defines lifecycle states and CC-08b catches transitions 
          that break dependencies, but neither specifies the positive 
          path: how dependents learn about deprecation and what they're 
          expected to do. Without this, superseded intents become 
          zombie references that nobody cleans up.

      - id: CC-26
        tier: core
        test: "The manifesto names its own failure modes"
        verifiable_by: >
          A dedicated section exists that describes at least three 
          distinct ways the model can be adopted badly. At minimum:
            (a) performative intent — declarations that pass schema 
                validation but capture no real commitment,
            (b) over-specification — intent declarations so granular 
                that they create more governance overhead than value,
            (c) intent drift — declared intents that no longer reflect 
                actual system behavior but are never updated.
          Each failure mode includes: a name, symptoms, root cause, 
          and at least one mitigation.
        rationale: >
          A model without a failure mode catalogue cannot diagnose 
          its own misuse. The manifesto's principles imply these 
          risks but never name them explicitly. Naming them gives 
          adopters the vocabulary to self-correct.

      - id: CC-27
        tier: core
        test: "The transition log is complete and consistent"
        verifiable_by: >
          Every version bump in the intent block has a corresponding 
          entry in transition_log. Specifically:
            (a) the set of (from, to) pairs in the log covers every 
                consecutive version pair from 1.0.0 to the current 
                version with no gaps,
            (b) each entry's summary accounts for all criteria added, 
                removed, moved, or modified in that transition,
            (c) each entry's change_type is a valid value from the 
                canonical change_type enum defined in this intent block
                (clarification | correction | extension | 
                reclassification | breaking | deprecation).
        rationale: >
          The transition log is the only record of why the criteria 
          evolved. Without an integrity check, the log can silently 
          fall behind actual changes, making the version number 
          meaningful in name only. This is especially important 
          because the transition log is what makes the model's own 
          evolution auditable — and auditability is a core value 
          the model demands of the systems it governs.

    # ─── DEFERRED ────────────────────────────────────────────────────

    deferred:
      - id: CC-22
        tier: deferred
        test: "Cross-repo intent dependencies have a discovery protocol"
        promote_when: >
          The model is adopted across more than one repository 
          and at least one cross-repo depends_on_intents reference 
          exists in production.
        verifiable_by: >
          The spec defines how an upstream repo discovers which 
          downstream repos depend on its intents. At minimum:
            (a) at least one discovery mechanism is specified 
                (pull-based scan, push-based registry, or both),
            (b) the notification payload on MAJOR bump is defined,
            (c) a failure mode is described for when downstream 
                repos do not acknowledge the notification.
        rationale: >
          depends_on_intents declares a relationship but does not 
          specify how it is operationalized. Without a discovery 
          model, cross-repo dependencies are write-only metadata.
          However, this is a distributed systems problem that should 
          be informed by real adoption experience, not specified 
          ahead of need.
        downstream_dependents:
          - CC-25  # deprecation ceremonies extend to cross-repo 
                   # when this criterion is promoted

      - id: CC-24
        tier: deferred
        test: "The core schema has evolution semantics"
        promote_when: >
          The first schema change proposal is made against the 
          core intent model (schema_version bump from 0.x to 1.0 
          or any post-1.0 MAJOR change).
        verifiable_by: >
          The spec defines how the core intent model schema itself 
          evolves. At minimum:
            (a) PATCH/MINOR/MAJOR semantics are defined for schema 
                changes (not just intent changes),
            (b) migration requirements for each level are stated.
          The spec need not prescribe an organizational review 
          process — that emerges from the adopting team's structure.
        rationale: >
          The model advocates governance for intent but does not apply 
          it to its own evolution. schema_version exists as a field 
          but the protocol for bumping it is unspecified. Defining 
          the technical semantics (what constitutes a breaking schema 
          change, what migrations look like) is necessary. Prescribing 
          the social process (who reviews, how proposals are submitted) 
          is premature until the model has real adopters.
